[project]
name = "distributed-simulator"
version = "0.1.0"
description = "Simulated distributed training with virtual workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7",
    "packed-resnet",
    "pydantic>=2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
dsim-train = "distributed_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["external", "reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
packed-resnet = { path = "external/Packed-ResNet", editable = true }
